version: '3.8'

services:
  # ----------------------------------------------------------------------------
  # 1. PostgreSQL Database Service
  # ----------------------------------------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: brightloop-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-odoo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-odoo}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - brightloop-db-data:/var/lib/postgresql/data
    networks:
      - brightloop-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odoo"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------------------------
  # 2. Odoo Enterprise 19 Core ERP & Module Service
  # ----------------------------------------------------------------------------
  odoo:
    image: odoo:19.0
    container_name: brightloop-odoo
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${ODOO_PORT:-8069}:8069"
    environment:
      HOST: db
      USER: ${POSTGRES_USER:-odoo}
      PASSWORD: ${POSTGRES_PASSWORD:-odoo}
    volumes:
      - brightloop-web-data:/var/lib/odoo
      - .:/mnt/extra-addons/subscription_management
    networks:
      - brightloop-net

  # ----------------------------------------------------------------------------
  # 3. Backend REST API & Subscription Microservice
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: brightloop-backend-api
    restart: unless-stopped
    environment:
      PORT: 5000
      NODE_ENV: production
      CLIENT_URL: http://localhost:3000
      DATABASE_URL: postgres://${POSTGRES_USER:-odoo}:${POSTGRES_PASSWORD:-odoo}@db:5432/subscription_db
    ports:
      - "${BACKEND_PORT:-5000}:5000"
    networks:
      - brightloop-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  # ----------------------------------------------------------------------------
  # 4. Frontend Web Client (Vite SPA + Nginx Reverse Proxy)
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: brightloop-frontend-web
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    networks:
      - brightloop-net
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 15s
      timeout: 5s
      retries: 3

networks:
  brightloop-net:
    driver: bridge

volumes:
  brightloop-db-data:
    driver: local
  brightloop-web-data:
    driver: local
