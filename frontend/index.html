<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <meta content="web_dashboard" name="shell-type" />
    <title>Brightloop Enterprise Subscription & Billing System</title>
    
    <!-- Google Fonts & Material Symbols -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />

    <!-- Tailwind CSS (Vite builds via PostCSS/Tailwind; CDN provided as seamless standalone preview fallback) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              background: "#f8f9ff",
              surface: "#f8f9ff",
              "surface-container-lowest": "#ffffff",
              "surface-container-low": "#eff4ff",
              "surface-container": "#e5eeff",
              "surface-container-high": "#dce9ff",
              "on-surface": "#0b1c30",
              "on-surface-variant": "#434655",
              primary: "#004ac6",
              "primary-container": "#2563eb",
              "on-primary": "#ffffff",
              "on-primary-container": "#eeefff",
              secondary: "#565e74",
              "secondary-container": "#dae2fd",
              "on-secondary-container": "#5c647a",
              tertiary: "#006242",
              "tertiary-container": "#007d55",
              "on-tertiary": "#ffffff",
              error: "#ba1a1a",
              "error-container": "#ffdad6",
              "on-error": "#ffffff",
              "on-error-container": "#93000a"
            },
            fontFamily: {
              base: ["Inter", "sans-serif"]
            }
          }
        }
      };
    </script>
  </head>
  <body class="bg-[#f8f9ff] text-[#0b1c30] antialiased">
    <!-- Single Page App Mount Point -->
    <div id="app"></div>

    <!-- Application Module Entry -->
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
